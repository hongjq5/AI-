spring:
  application:
    name: yubi-backend
  # 默认 dev 环境
  profiles:
    active: dev
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${MYSQL_URL:jdbc:mysql://127.0.0.1:3307/yubi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}"
    username: "${MYSQL_USER}"
    password: "${MYSQL_PASSWORD}"
  # Redis 配置
  # todo 需替换配置，然后取消注释
  redis:
    database: 1
    host: "${REDIS_HOST:127.0.0.1}"
    port: "${REDIS_PORT:6380}"
    timeout: 5000
    password: "${REDIS_PASSWORD:}"
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
#  elasticsearch:
#    uris: "${ELASTICSEARCH_URIS:http://127.0.0.1:9200}"
#    username: "${ELASTICSEARCH_USERNAME:}"
#    password: "${ELASTICSEARCH_PASSWORD:}"
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
  rabbitmq:
    host: "${RABBITMQ_HOST:127.0.0.1}"
    port: "${RABBITMQ_PORT:5673}"
    password: "${RABBITMQ_PASSWORD}"
    username: "${RABBITMQ_USER}"
    virtual-host: "${RABBITMQ_VHOST:yubi}"
server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 微信相关
wx:
  # 微信公众平台
  # todo 需替换配置
  mp:
    token: "${WX_MP_TOKEN:not-configured}"
    aesKey: "${WX_MP_AES_KEY:not-configured}"
    appId: "${WX_MP_APP_ID:not-configured}"
    secret: "${WX_MP_SECRET:not-configured}"
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: "${REDIS_HOST:127.0.0.1}"
        port: "${REDIS_PORT:6380}"
      type: Memory
  # 微信开放平台
  # todo 需替换配置
  open:
    appId: "${WX_OPEN_APP_ID:not-configured}"
    appSecret: "${WX_OPEN_APP_SECRET:not-configured}"
# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: "${COS_ACCESS_KEY:not-configured}"
    secretKey: "${COS_SECRET_KEY:not-configured}"
    region: "${COS_REGION:not-configured}"
    bucket: "${COS_BUCKET:not-configured}"
# 鱼聪明 AI 配置（https://yucongming.com/）
yuapi:
  client:
    access-key: "${YUCONGMING_ACCESS_KEY:not-configured}"
    secret-key: "${YUCONGMING_SECRET_KEY:not-configured}"
# 发布副本默认禁用外部 AI 调用，配置环境变量后再启用。
bi:
  ai:
    enabled: "${BI_AI_ENABLED:false}"
    model-id: "${BI_AI_MODEL_ID:0}"
